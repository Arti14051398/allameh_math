  :root {
    --bg1: #1b1240;
    --bg2: #3a1c71;
    --bg3: #d76d77;
    --card: rgba(255,255,255,0.09);
    --card-border: rgba(255,255,255,0.18);
    --text: #f8f6ff;
    --muted: #cfc6ef;
    --accent1: #a78bfa;
    --accent2: #60a5fa;
    --accent3: #7cf5d4;
    --ok: #3ddc97;
    --bad: #ff5c7a;
    --gold: #f5e3a3;
  }
  * { box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    margin: 0;
    font-family: "Vazirmatn", Tahoma, sans-serif;
    color: var(--text);
    background: linear-gradient(135deg, var(--bg1), var(--bg2) 55%, var(--bg3));
    background-attachment: fixed;
    overflow-x: hidden;
    min-height: 100vh;
    padding: 24px 14px 60px;
  }

  /* ---------- floating decorative shapes ---------- */
  .bg-shapes { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .shape {
    position: absolute; opacity: .18; font-size: 2.2rem; color: #fff;
    animation: float 14s ease-in-out infinite;
    user-select: none;
  }
  .shape:nth-child(odd) { animation-duration: 18s; }
  @keyframes float {
    0%,100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-30px) rotate(18deg); }
  }

  .wrap { position: relative; z-index: 1; max-width: 780px; margin: 0 auto; }

  /* ---------- header ---------- */
  header { text-align: center; margin-bottom: 18px; }
  .title {
    font-size: clamp(1.4rem, 4vw, 2rem); font-weight: 900; margin: 0;
    background: linear-gradient(90deg, var(--accent1), var(--accent2), var(--accent3));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: 0 0 30px rgba(255,255,255,.15);
  }
  .subtitle { color: var(--muted); margin: 4px 0 0; font-size: .95rem; }

  /* ---------- progress dots ---------- */
  .dots { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin: 16px 0 6px; }
  .dot {
    width: 30px; height: 30px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,.35);
    display: grid; place-items: center; font-size: .8rem; font-weight: 700;
    color: var(--muted); background: rgba(255,255,255,.05);
    transition: all .35s cubic-bezier(.34,1.56,.64,1);
  }
  .dot.current { border-color: var(--gold); color: var(--gold); transform: scale(1.18); box-shadow: 0 0 14px rgba(255,216,107,.6); }
  .dot.done-ok { background: var(--ok); border-color: var(--ok); color: #0c2a1c; }
  .dot.done-bad { background: var(--bad); border-color: var(--bad); color: #2a0712; }

  /* ---------- card ---------- */
  .card {
    background: var(--card);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--card-border);
    border-radius: 26px;
    padding: 26px 24px;
    box-shadow: 0 20px 60px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.2);
    animation: slideIn .5s cubic-bezier(.22,1,.36,1);
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateX(-30px) scale(.98); }
    to   { opacity: 1; transform: none; }
  }
  .card.shake { animation: shake .5s; }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20% { transform: translateX(-10px); }
    40% { transform: translateX(10px); }
    60% { transform: translateX(-7px); }
    80% { transform: translateX(5px); }
  }

  .meta { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 14px; border-radius: 999px; font-size: .85rem; font-weight: 700;
    background: linear-gradient(90deg, var(--accent1), var(--accent2)); color: #2b0d1f;
  }
  .book-ref {
    font-size: .8rem; color: var(--muted); background: rgba(255,255,255,.08);
    padding: 5px 12px; border-radius: 999px;
  }
  .score-pill {
    font-size: .85rem; color: var(--accent3); background: rgba(124,245,212,.1);
    padding: 5px 12px; border-radius: 999px; font-weight: 700;
  }

  .question {
    font-size: 1.1rem; line-height: 2.1; padding: 18px 18px;
    background: rgba(0,0,0,.18); border-radius: 18px; border-right: 5px solid var(--accent2);
    margin-bottom: 18px;
  }
  .ltr {
    direction: ltr; unicode-bidi: isolate; display: inline-block;
    font-family: "Times New Roman", "Cambria Math", serif; font-size: 1.12rem;
    color: var(--gold); padding: 0 2px;
  }

  /* ---------- hint ---------- */
  .hint-btn {
    background: transparent; border: 1px dashed var(--accent3); color: var(--accent3);
    padding: 7px 14px; border-radius: 12px; cursor: pointer; font-family: inherit; font-size: .9rem;
    margin-bottom: 14px;
  }
  .hint-btn:hover { background: rgba(124,245,212,.08); }
  .hint-box {
    display: none; background: rgba(124,245,212,.08); border: 1px solid rgba(124,245,212,.35);
    padding: 12px 14px; border-radius: 14px; margin-bottom: 16px; color: #d9fff3; font-size: .95rem;
  }
  .hint-box.show { display: block; animation: slideIn .4s; }

  /* ---------- options ---------- */
  .options { display: grid; gap: 12px; grid-template-columns: 1fr; }
  @media (min-width: 560px) { .options { grid-template-columns: 1fr 1fr; } }
  .option {
    display: flex; align-items: center; gap: 12px; text-align: right;
    padding: 14px 16px; border-radius: 16px; cursor: pointer;
    background: rgba(255,255,255,.07); border: 2px solid rgba(255,255,255,.14);
    color: var(--text); font-family: inherit; font-size: 1.02rem;
    transition: transform .2s, background .2s, border-color .2s, box-shadow .2s;
  }
  .option:hover:not(:disabled) {
    transform: translateY(-3px) scale(1.01);
    border-color: var(--accent3);
    background: rgba(124,245,212,.1);
    box-shadow: 0 10px 25px rgba(0,0,0,.25);
  }
  .option:disabled { cursor: default; }
  .letter {
    flex: 0 0 34px; height: 34px; border-radius: 10px;
    display: grid; place-items: center; font-weight: 900;
    background: rgba(255,255,255,.14);
  }
  .option .val { flex: 1; }
  .option.correct {
    border-color: var(--ok); background: rgba(61,220,151,.18);
    box-shadow: 0 0 22px rgba(61,220,151,.45);
    animation: pulseOk 1s ease;
  }
  .option.correct .letter { background: var(--ok); color: #082a1a; }
  .option.wrong { border-color: var(--bad); background: rgba(255,92,122,.18); animation: shake .5s; }
  .option.wrong .letter { background: var(--bad); color: #2a0712; }
  .option.dim { opacity: .45; }
  @keyframes pulseOk {
    0% { transform: scale(1); } 40% { transform: scale(1.04); } 100% { transform: scale(1); }
  }

  /* ---------- feedback ---------- */
  .feedback {
    margin-top: 18px; padding: 14px 18px; border-radius: 16px; font-weight: 700; font-size: 1.05rem;
    display: none; align-items: center; gap: 10px;
  }
  .feedback.show { display: flex; animation: slideIn .4s; }
  .feedback.ok { background: linear-gradient(90deg, rgba(61,220,151,.25), rgba(61,220,151,.08)); border: 1px solid var(--ok); }
  .feedback.no { background: linear-gradient(90deg, rgba(255,92,122,.25), rgba(255,92,122,.08)); border: 1px solid var(--bad); }
  .feedback .emoji { font-size: 1.8rem; }

  /* ---------- solution ---------- */
  .solution { display: none; margin-top: 18px; }
  .solution.show { display: block; animation: slideIn .5s; }
  .sol-title {
    display: flex; align-items: center; gap: 8px; font-weight: 900; color: var(--gold);
    font-size: 1.1rem; margin-bottom: 12px;
  }
  .step {
    display: flex; gap: 12px; align-items: flex-start;
    background: rgba(255,255,255,.06); border-radius: 16px; padding: 12px 14px; margin-bottom: 10px;
    border: 1px solid rgba(255,255,255,.1);
    opacity: 0; transform: translateY(10px);
    animation: stepIn .5s forwards;
  }
  @keyframes stepIn { to { opacity: 1; transform: none; } }
  .step-num {
    flex: 0 0 30px; height: 30px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent3), var(--accent1));
    color: #1b1240; font-weight: 900; display: grid; place-items: center; font-size: .9rem;
  }
  .step-body { flex: 1; line-height: 1.95; }
  .tip {
    margin-top: 12px; padding: 12px 14px; border-radius: 14px;
    background: linear-gradient(90deg, rgba(255,107,154,.2), rgba(255,184,108,.12));
    border-right: 4px solid var(--accent2); font-size: .95rem;
  }

  /* ---------- nav ---------- */
  .nav { display: flex; justify-content: space-between; align-items: center; margin-top: 22px; gap: 10px; flex-wrap: wrap; }
  .btn {
    font-family: inherit; font-size: 1rem; font-weight: 700;
    padding: 12px 24px; border: none; border-radius: 14px; cursor: pointer; color: #1b1240;
    background: linear-gradient(90deg, var(--accent1), var(--accent2));
    box-shadow: 0 8px 20px rgba(255,107,154,.35);
    transition: transform .2s, box-shadow .2s, opacity .2s;
  }
  .btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 12px 26px rgba(255,107,154,.5); }
  .btn:disabled { opacity: .4; cursor: not-allowed; box-shadow: none; }
  .btn.ghost {
    background: rgba(255,255,255,.1); color: var(--text); box-shadow: none; border: 1px solid var(--card-border);
  }

  /* ---------- end screen ---------- */
  .end { text-align: center; padding: 20px 10px; display: none; }
  .end.show { display: block; animation: slideIn .6s; }
  .trophy { font-size: 4.5rem; animation: bounce 1.6s infinite; }
  @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
  .end h2 { font-size: 1.6rem; margin: 10px 0 4px; }
  .end .big { font-size: 3rem; font-weight: 900; color: var(--gold); text-shadow: 0 0 25px rgba(255,216,107,.5); }
  .end .msg { color: var(--muted); margin-bottom: 18px; }
  .results { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin: 14px 0 22px; }
  .res-cell {
    border-radius: 12px; padding: 10px 4px; font-size: .8rem; font-weight: 700;
    background: rgba(255,255,255,.08);
  }
  .res-cell.ok { background: rgba(61,220,151,.25); }
  .res-cell.bad { background: rgba(255,92,122,.25); }

  /* ---------- confetti ---------- */
  .confetti { position: fixed; top: -20px; width: 10px; height: 14px; z-index: 99; pointer-events: none; animation: fall linear forwards; }
  @keyframes fall {
    to { transform: translateY(110vh) rotate(720deg); opacity: 0; }
  }

  footer { text-align: center; color: var(--muted); font-size: .85rem; margin-top: 26px; opacity: .8; }
  kbd { background: rgba(255,255,255,.15); padding: 1px 6px; border-radius: 6px; font-family: inherit; }
  .title-row { display: flex; align-items: center; justify-content: center; gap: 14px; flex-wrap: wrap; }
  .title-row .title { margin: 0; }
  .logo { width: 52px; height: 52px; flex: 0 0 auto; border-radius: 50%; box-shadow: 0 0 0 3px rgba(0,190,255,.6), 0 6px 18px rgba(0,0,0,.35); }

  header.hero::before {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(20,10,50,.55), rgba(20,10,50,.35) 60%, rgba(20,10,50,.7));
  }
  header.hero > * { position: relative; }

  /* ===== extra polish ===== */
  .aurora {
    position: fixed; inset: -20%; z-index: 0; pointer-events: none; filter: blur(50px);
    background:
      radial-gradient(circle at 20% 30%, rgba(124,58,237,.45), transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(56,189,248,.35), transparent 45%),
      radial-gradient(circle at 60% 20%, rgba(244,114,182,.30), transparent 40%);
    animation: aurora 22s ease-in-out infinite alternate;
  }
  @keyframes aurora {
    0%   { transform: translate(0,0) scale(1) rotate(0deg); }
    100% { transform: translate(-5%,4%) scale(1.1) rotate(4deg); }
  }
  #particles { position: fixed; inset: 0; z-index: 0; pointer-events: none; }

  h1.title { animation: glowPulse 4s ease-in-out infinite; min-height: 1.4em; }
  @keyframes glowPulse {
    0%,100% { filter: drop-shadow(0 0 6px rgba(124,245,212,.35)); }
    50%     { filter: drop-shadow(0 0 16px rgba(255,107,154,.55)); }
  }

  .card {
    position: relative; isolation: isolate;
    background: rgba(22,14,52,.84);
  }

  .corner {
    position: absolute; font-size: 1.25rem; color: var(--gold); opacity: .75;
    font-family: "Times New Roman", serif; pointer-events: none; z-index: 2;
    animation: twinkle 3.2s ease-in-out infinite;
  }
  .c1 { top: 10px; right: 14px; }
  .c2 { top: 10px; left: 14px; animation-delay: .8s; }
  .c3 { bottom: 10px; right: 14px; animation-delay: 1.6s; }
  .c4 { bottom: 10px; left: 14px; animation-delay: 2.4s; }
  @keyframes twinkle {
    50% { opacity: .2; transform: scale(.7) rotate(45deg); }
  }

  .dots { position: relative; }
  .dots::before {
    content: ""; position: absolute; left: 16px; right: 16px; top: 50%; height: 3px;
    transform: translateY(-50%); border-radius: 3px; opacity: .45;
    background: linear-gradient(90deg, var(--accent1), var(--accent2), var(--accent3));
  }
  .dot { position: relative; z-index: 1; }
  .ball {
    position: absolute; top: 100%; margin-top: 6px; width: 14px; height: 14px; margin-left: -7px;
    border-radius: 50%; background: #fff; z-index: 2; pointer-events: none;
    box-shadow: 0 0 12px #fff, 0 0 24px var(--accent2);
    transition: left .6s cubic-bezier(.34,1.56,.64,1);
    left: 0;
  }

  .option { transform-style: preserve-3d; transition: transform .15s ease-out, background .2s, border-color .2s, box-shadow .2s; }

  /* ===== sound toggle ===== */
  .sound-btn {
    position: fixed; top: 14px; left: 14px; z-index: 50; width: 44px; height: 44px;
    border-radius: 50%; border: 1px solid var(--card-border); cursor: pointer;
    background: rgba(22,14,52,.7); color: var(--text); font-size: 1.2rem;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    transition: transform .2s, background .2s;
  }
  .sound-btn:hover { transform: scale(1.08); background: rgba(124,245,212,.15); }
  .sound-btn.muted { opacity: .55; }

  /* ===================== creative polish pack ===================== */

  /* 1) chalk-like reveal of each solution step (right to left) */
  .step {
    opacity: 1; transform: none; position: relative;
    clip-path: inset(0 0 0 100%);
    animation: chalkIn 1s cubic-bezier(.4,0,.2,1) forwards;
  }
  @keyframes chalkIn { to { clip-path: inset(0 0 0 0); } }

  /* 2) glass card with glints that twinkle at the four corners */
  .card::after {
    content: ""; position: absolute; inset: 0; border-radius: inherit; z-index: -1; pointer-events: none;
    background:
      radial-gradient(circle at 0 0, rgba(255,255,255,.35), transparent 20%),
      radial-gradient(circle at 100% 0, rgba(255,255,255,.35), transparent 20%),
      radial-gradient(circle at 0 100%, rgba(255,255,255,.35), transparent 20%),
      radial-gradient(circle at 100% 100%, rgba(255,255,255,.35), transparent 20%);
    animation: glint 4s ease-in-out infinite;
  }
  @keyframes glint { 0%,100% { opacity: .35; } 50% { opacity: 1; } }

  /* 3) soft colored glow that blooms on a correct answer */
  .card.win { animation: slideIn .5s cubic-bezier(.22,1,.36,1), cardGlow 1.1s ease; }
  @keyframes cardGlow {
    0%   { box-shadow: 0 20px 60px rgba(0,0,0,.35), 0 0 0 rgba(61,220,151,0); }
    40%  { box-shadow: 0 20px 60px rgba(0,0,0,.35), 0 0 90px rgba(61,220,151,.45); }
    100% { box-shadow: 0 20px 60px rgba(0,0,0,.35), 0 0 30px rgba(61,220,151,.15); }
  }

  /* 4) slide transition between questions */
  #quiz.out { animation: slideOutL .28s ease forwards; }
  #quiz.in  { animation: slideInR .45s cubic-bezier(.22,1,.36,1); }
  @keyframes slideOutL { to { opacity: 0; transform: translateX(-40px); } }
  @keyframes slideInR  { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: none; } }

  /* 5) ripple of light from the correct option */
  .option { position: relative; overflow: hidden; }
  .option.correct::after {
    content: ""; position: absolute; left: 50%; top: 50%; width: 12px; height: 12px; margin: -6px 0 0 -6px;
    border-radius: 50%; background: rgba(124,245,212,.55); pointer-events: none;
    animation: ripple .9s ease-out forwards;
  }
  @keyframes ripple { to { transform: scale(40); opacity: 0; } }

  /* 6) breathing halo on the current progress dot */
  .dot.current { animation: halo 2.2s ease-in-out infinite; }
  @keyframes halo {
    0%,100% { box-shadow: 0 0 8px rgba(245,227,163,.45); }
    50%     { box-shadow: 0 0 22px rgba(245,227,163,.95); }
  }

  /* 7) faint drifting formulas in the background */
  .formula {
    position: fixed; z-index: 0; pointer-events: none; color: rgba(255,255,255,.1);
    font-size: 1.15rem; animation: drift 26s ease-in-out infinite alternate;
  }
  .formula .ltr { color: inherit; font-size: inherit; }
  @keyframes drift { from { transform: translate(0,0); } to { transform: translate(22px,-16px); } }

  /* 8) clear typographic hierarchy */
  .badge { font-weight: 900; font-size: .95rem; letter-spacing: .3px; }
  .sol-title { font-weight: 900; font-size: 1.2rem; }
  .end h2 { font-weight: 900; }
  .question { font-weight: 400; }

  /* 10) thin geometric frame on the final screen */
  .end { position: relative; }
  .end::before, .end::after {
    content: ""; position: absolute; pointer-events: none; border-radius: 18px;
  }
  .end::before { inset: 4px; border: 1px solid rgba(124,245,212,.35); }
  .end::after  { inset: 11px; border: 1px dashed rgba(167,139,250,.35); }
  .end.show { padding: 26px 18px; }

  /* ===================== beauty pass 2 ===================== */

  /* animated shimmer across the title */
  .title {
    background-image: linear-gradient(100deg, var(--accent1) 0%, #ffffff 25%, var(--accent2) 45%, var(--accent3) 70%, var(--accent1) 100%);
    background-size: 220% 100%;
    animation: shimmer 6s linear infinite, glowPulse 4s ease-in-out infinite;
  }
  @keyframes shimmer { to { background-position: -220% 0; } }

  /* glass card gets a soft inner highlight and deeper shadow */
  .card {
    box-shadow: 0 30px 80px rgba(5,2,25,.55), inset 0 1px 0 rgba(255,255,255,.18), inset 0 -1px 0 rgba(0,0,0,.25);
    border-color: rgba(255,255,255,.14);
  }

  /* question box: gradient border and a little ornament on the edge */
  .question {
    position: relative;
    background: linear-gradient(135deg, rgba(167,139,250,.14), rgba(96,165,250,.06) 60%, rgba(124,245,212,.08));
    border-right: none;
    box-shadow: inset 0 0 0 1px rgba(167,139,250,.28), 0 10px 30px rgba(0,0,0,.25);
  }
  .question::before {
    content: ""; position: absolute; right: -1px; top: 18px; bottom: 18px; width: 3px; border-radius: 3px;
    background: linear-gradient(180deg, var(--accent1), var(--accent2), var(--accent3));
  }

  /* options: gradient rim and a light sweep on hover */
  .option {
    background: linear-gradient(160deg, rgba(255,255,255,.09), rgba(255,255,255,.03));
    box-shadow: inset 0 1px 0 rgba(255,255,255,.12);
  }
  .option::before {
    content: ""; position: absolute; top: 0; bottom: 0; left: -60%; width: 40%;
    background: linear-gradient(100deg, transparent, rgba(255,255,255,.22), transparent);
    transform: skewX(-20deg); transition: left .7s ease; pointer-events: none;
  }
  .option:hover:not(:disabled)::before { left: 130%; }
  .option .letter {
    background: linear-gradient(135deg, rgba(167,139,250,.55), rgba(96,165,250,.45));
    box-shadow: 0 4px 14px rgba(96,165,250,.35);
  }
  .option.correct .letter { background: var(--ok); box-shadow: 0 4px 16px rgba(61,220,151,.5); }
  .option.wrong .letter { background: var(--bad); box-shadow: 0 4px 16px rgba(255,92,122,.5); }

  /* hint: calmer, more elegant */
  .hint-btn { background: rgba(124,245,212,.06); letter-spacing: .2px; }
  .hint-box { backdrop-filter: blur(6px); }

  /* progress: ring around current dot and a brighter track */
  .dot.current { border-color: var(--gold); background: rgba(245,227,163,.12); }
  .dots::before { height: 4px; opacity: .6; box-shadow: 0 0 12px rgba(167,139,250,.45); }
  .ball { width: 12px; height: 12px; margin-left: -6px; }

  /* solution card: elegant step cards with a left accent bar */
  .step {
    background: linear-gradient(135deg, rgba(255,255,255,.075), rgba(255,255,255,.025));
    border: 1px solid rgba(255,255,255,.1);
    box-shadow: 0 6px 18px rgba(0,0,0,.18);
  }
  .step-num {
    box-shadow: 0 0 0 4px rgba(124,245,212,.12), 0 6px 16px rgba(124,245,212,.25);
  }
  .tip {
    box-shadow: inset 0 0 0 1px rgba(255,107,154,.25);
  }

  /* feedback banners glow softly */
  .feedback.ok { box-shadow: 0 0 30px rgba(61,220,151,.18); }
  .feedback.no { box-shadow: 0 0 30px rgba(255,92,122,.18); }

  /* primary button: gradient with a glossy highlight */
  .btn {
    background: linear-gradient(135deg, #c4b5fd, #60a5fa 55%, #7cf5d4);
    color: #14102e;
    box-shadow: 0 10px 26px rgba(96,165,250,.35), inset 0 1px 0 rgba(255,255,255,.5);
  }
  .btn:hover:not(:disabled) { box-shadow: 0 14px 30px rgba(96,165,250,.5), inset 0 1px 0 rgba(255,255,255,.6); }
  .btn.ghost { background: rgba(255,255,255,.08); color: var(--text); }

  /* end screen: glowing trophy and gradient score */
  .trophy { filter: drop-shadow(0 0 22px rgba(245,227,163,.55)); }
  .end .big {
    background: linear-gradient(90deg, #f5e3a3, #ffffff, #7cf5d4);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .res-cell { border: 1px solid rgba(255,255,255,.1); transition: transform .2s; }
  .res-cell:hover { transform: translateY(-3px); }
  .res-cell.ok  { background: linear-gradient(160deg, rgba(61,220,151,.35), rgba(61,220,151,.12)); }
  .res-cell.bad { background: linear-gradient(160deg, rgba(255,92,122,.35), rgba(255,92,122,.12)); }

  /* sound button: subtle glow ring */
  .sound-btn { box-shadow: 0 0 0 4px rgba(167,139,250,.12), 0 8px 20px rgba(0,0,0,.3); }

  /* ===================== beauty pass 3 ===================== */

  /* richer, layered page atmosphere */
  body::after {
    content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(ellipse at 50% 0%, rgba(167,139,250,.18), transparent 60%),
      radial-gradient(ellipse at 50% 100%, rgba(5,3,25,.6), transparent 70%);
  }

  /* heading block: soft halo behind the title and logo */
  .title-row { position: relative; }
  .title-row::before {
    content: ""; position: absolute; left: 50%; top: 50%; width: 70%; height: 160%;
    transform: translate(-50%,-50%); border-radius: 50%; z-index: -1;
    background: radial-gradient(closest-side, rgba(96,165,250,.28), transparent);
    filter: blur(10px); pointer-events: none;
  }
  .logo { transition: transform .4s cubic-bezier(.34,1.56,.64,1); }
  .logo:hover { transform: rotate(-8deg) scale(1.06); }

  /* badge: gradient pill with glow */
  .badge {
    background: linear-gradient(135deg, #c4b5fd, #60a5fa 60%, #7cf5d4); color: #14102e;
    box-shadow: 0 6px 18px rgba(96,165,250,.35), inset 0 1px 0 rgba(255,255,255,.5);
  }
  .book-ref {
    background: rgba(167,139,250,.12); color: #e9e3ff;
    box-shadow: inset 0 0 0 1px rgba(167,139,250,.25);
  }

  /* question text: a touch more air and a gentle text glow */
  .question { font-size: 1.12rem; line-height: 2.2; text-shadow: 0 1px 12px rgba(167,139,250,.25); }
  .question .ltr { color: #f5e3a3; text-shadow: 0 0 12px rgba(245,227,163,.35); }

  /* options: animated gradient rim on hover */
  .option { isolation: isolate; }
  .option::after {
    content: ""; position: absolute; inset: -2px; border-radius: 18px; z-index: -1; opacity: 0;
    background: linear-gradient(120deg, #a78bfa, #60a5fa, #7cf5d4, #a78bfa);
    background-size: 300% 100%; transition: opacity .3s;
  }
  .option:hover:not(:disabled)::after { opacity: 1; animation: rim 3s linear infinite; }
  @keyframes rim { to { background-position: 300% 0; } }
  .option:hover:not(:disabled) { box-shadow: 0 14px 30px rgba(0,0,0,.3), 0 0 22px rgba(96,165,250,.25); }
  .option.correct::after, .option.wrong::after { display: none; }

  /* progress dots: refined glass circles */
  .dot {
    background: rgba(255,255,255,.04);
    border-color: rgba(255,255,255,.22);
    backdrop-filter: blur(4px);
  }
  .dot.done-ok  { box-shadow: 0 0 12px rgba(61,220,151,.45); }
  .dot.done-bad { box-shadow: 0 0 12px rgba(255,92,122,.45); }

  /* solution steps: left-aligned numerals sit on a glowing ring */
  .step-num {
    background: linear-gradient(135deg, #7cf5d4, #60a5fa);
    color: #0f0b26; font-size: .95rem;
  }
  .sol-title {
    background: linear-gradient(90deg, #f5e3a3, #ffffff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .tip { background: linear-gradient(90deg, rgba(167,139,250,.2), rgba(96,165,250,.1)); }

  /* feedback: icon chip with glow */
  .feedback .emoji {
    display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 50%;
    font-size: 1.1rem; font-weight: 900; flex: 0 0 34px;
  }
  .feedback.ok .emoji { background: rgba(61,220,151,.25); color: #b9ffe0; box-shadow: 0 0 18px rgba(61,220,151,.5); }
  .feedback.no .emoji { background: rgba(255,92,122,.25); color: #ffd1da; box-shadow: 0 0 18px rgba(255,92,122,.5); }

  /* navigation buttons: soft pill look */
  .nav .btn { border-radius: 999px; padding: 12px 28px; }

  /* end screen: stronger hierarchy and ambient glow */
  .end h2 {
    background: linear-gradient(90deg, #ffffff, #c4b5fd, #7cf5d4);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .end .msg { color: #ddd6fe; }
  .results { gap: 10px; }
  .res-cell { border-radius: 14px; font-size: .85rem; }
  .res-cell.ok, .res-cell.bad { box-shadow: 0 6px 16px rgba(0,0,0,.2); }

  /* ===================== typography pass ===================== */
  body {
    font-family: "Vazirmatn", "Segoe UI", Tahoma, system-ui, sans-serif;
    font-weight: 400;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    font-feature-settings: "kern" 1;
  }
  /* Persian text reads best with generous line height */
  .question { font-weight: 500; line-height: 2.25; font-size: 1.15rem; }
  .option { font-weight: 500; font-size: 1.04rem; line-height: 1.6; }
  .step-body { font-weight: 400; line-height: 2.05; font-size: 1rem; }
  .tip { font-weight: 500; line-height: 2; }
  .hint-box { line-height: 2; }
  .feedback { font-weight: 700; letter-spacing: .1px; }
  .meta .badge { font-weight: 900; }
  .book-ref { font-weight: 500; }

  /* headings: heavier, tighter, more confident */
  .title { font-weight: 900; letter-spacing: -.2px; line-height: 1.5; }
  .subtitle { font-weight: 400; }
  .end h2 { font-weight: 900; font-size: 1.75rem; letter-spacing: -.2px; }
  .end .big { font-weight: 900; letter-spacing: -.5px; }
  .sol-title { font-weight: 900; font-size: 1.22rem; letter-spacing: -.1px; }

  /* buttons: crisp and balanced */
  .btn, .hint-btn, .option { font-family: inherit; font-weight: 700; }
  .option { font-weight: 500; }
  .btn { letter-spacing: 0; }

  /* math symbols: use a dedicated math-friendly face */
  .ltr, .formula, .formula .ltr {
    font-family: "STIX Two Math", "Cambria Math", "Times New Roman", serif;
    font-weight: 500;
    letter-spacing: .2px;
  }
  .question .ltr { font-size: 1.18rem; }
  .step-body .ltr { font-size: 1.05rem; }
  .formula { font-size: 1.25rem; }

  /* ===================== custom font: B Homa ===================== */
  body, button, input {
    font-family: "BHoma", "Vazirmatn", Tahoma, sans-serif !important;
  }
  /* math symbols and Latin formulas stay on the math face; BHoma lacks π, √, ² etc. */
  .ltr, .formula, .formula .ltr {
    font-family: "STIX Two Math", "Cambria Math", "BHoma", "Times New Roman", serif !important;
  }
  /* symbols like ✓ ✕ ♪ fall back gracefully */
  .feedback .emoji, .sound-btn, .res-cell { font-family: "BHoma", "STIX Two Math", "Segoe UI Symbol", sans-serif !important; }
</style>

const LETTERS = ['الف', 'ب', 'ج', 'د', 'ه'];
const PERSIAN_DIGITS = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
const toFa = n => String(n).replace(/\d/g, d => PERSIAN_DIGITS[d]);



let idx = 0, score = 0, answered = false;
const results = new Array(Q.length).fill(null); // null | true | false

const $ = id => document.getElementById(id);

function buildDots() {
  const d = $('dots');
  d.querySelectorAll('.dot').forEach(e => e.remove());
  Q.forEach((_, i) => {
    const s = document.createElement('div');
    s.className = 'dot';
    s.id = 'dot' + i;
    s.textContent = toFa(i + 1);
    s.title = 'برو به سوال ' + toFa(i + 1);
    s.onclick = () => { if (answered || results[i] !== null || i <= idx) goTo(i); };
    d.appendChild(s);
  });
}

function updateDots() {
  Q.forEach((_, i) => {
    const s = $('dot' + i);
    s.className = 'dot';
    if (results[i] === true) s.classList.add('done-ok');
    else if (results[i] === false) s.classList.add('done-bad');
    if (i === idx) s.classList.add('current');
  });
}

function render() {
  const item = Q[idx];
  answered = false;
  $('qBadge').textContent = 'سوال ' + toFa(idx + 1) + ' از ' + toFa(Q.length);
  $('bookRef').textContent = item.book;
  $('qText').innerHTML = item.q;

  $('hintBox').classList.remove('show');
  $('hintBox').innerHTML = item.hint;
  $('hintBtn').style.display = 'inline-block';

  const optsDiv = $('options');
  optsDiv.innerHTML = '';
  item.opts.forEach((o, i) => {
    const b = document.createElement('button');
    b.className = 'option';
    b.innerHTML = `<span class="letter">${LETTERS[i]}</span><span class="val"><span class="ltr">${o}</span></span>`;
    b.onclick = () => choose(i);
    tilt(b);
    optsDiv.appendChild(b);
  });

  $('feedback').className = 'feedback';
  $('feedback').innerHTML = '';
  $('solution').className = 'solution';
  $('solution').innerHTML = '';
  $('card').classList.remove('shake');
  $('card').classList.remove('win');

  const nb = $('nextBtn');
  nb.disabled = true;
  nb.textContent = idx === Q.length - 1 ? 'پایان آزمون' : 'سوال بعدی »';
  $('prevBtn').disabled = idx === 0;

  updateDots();
}

function choose(i) {
  if (answered) return;
  answered = true;
  const item = Q[idx];
  const buttons = document.querySelectorAll('.option');
  buttons.forEach(b => b.disabled = true);

  const correct = i === item.ans;
  results[idx] = correct;
  playSound(correct);

  if (correct) {
    score++;
    buttons[i].classList.add('correct');
    launchConfetti();
    $('card').classList.add('win');
    showFeedback(true);
  } else {
    buttons[i].classList.add('wrong');
    buttons[item.ans].classList.add('correct');
    buttons.forEach((b, k) => { if (k !== i && k !== item.ans) b.classList.add('dim'); });
    $('card').classList.add('shake');
    showFeedback(false);
  }

  $('hintBtn').style.display = 'none';
  showSolution(item);
  updateDots();
  $('nextBtn').disabled = false;
}

function showFeedback(ok) {
  const fb = $('feedback');
  fb.className = 'feedback show ' + (ok ? 'ok' : 'no');
  fb.innerHTML = ok
    ? '<span class="emoji">✓</span><span>درست است! آفرین، عالی حل کردی.</span>'
    : '<span class="emoji">✕</span><span>غلط است. گزینه‌ی سبز جواب درست است؛ پایین را بخوان تا دلیلش را بفهمی.</span>';
}

function showSolution(item) {
  const sol = $('solution');
  let html = '<div class="sol-title"> حل کامل و مرحله‌به‌مرحله</div>';
  item.steps.forEach((s, k) => {
    html += `<div class="step" style="animation-delay:${k * 0.15}s">
      <div class="step-num">${toFa(k + 1)}</div>
      <div class="step-body">${s}</div>
    </div>`;
  });
  html += `<div class="tip"><b>نکته‌ی طلایی:</b> ${item.tip}</div>`;
  sol.innerHTML = html;
  sol.className = 'solution show';
}

function goTo(i) {
  idx = i;
  $('quiz').style.display = 'block';
  $('end').classList.remove('show');
  render();
}

$('hintBtn').onclick = () => {
  $('hintBox').classList.add('show');
};

$('nextBtn').onclick = () => {
  if (idx >= Q.length - 1) return showEnd();
  idx++;
  render();
};

$('prevBtn').onclick = () => {
  if (idx > 0) { idx--; render(); }
};

const TROPHY_SVG = `<svg viewBox="0 0 64 64" width="72" height="72" fill="none" stroke="#ffd86b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8 H46 V26 A14 14 0 0 1 18 26 Z"/><path d="M18 14 H8 V20 A10 10 0 0 0 18 30"/><path d="M46 14 H56 V20 A10 10 0 0 1 46 30"/><line x1="32" y1="40" x2="32" y2="50"/><path d="M20 56 H44"/><path d="M24 50 H40 V56 H24 Z"/></svg>`;
function showEnd() {
  $('quiz').style.display = 'none';
  const end = $('end');
  end.classList.add('show');
  $('finalScore').textContent = toFa(score) + ' از ' + toFa(Q.length);

  const pct = score / Q.length;
  let title, msg, trophy;
  if (pct === 1)       { title = 'فوق‌العاده! کامل شدی '; msg = 'همه‌ی سوال‌ها را درست زدی. تو آماده‌ی تیزهوشانی!'; trophy = TROPHY_SVG; }
  else if (pct >= .7)  { title = 'عالی بود! '; msg = 'تسلط خوبی داری. سوال‌های غلط را دوباره مرور کن.'; trophy = TROPHY_SVG; }
  else if (pct >= .4)  { title = 'خوب پیش می‌روی '; msg = 'با تمرین بیشتر، این سوال‌ها برایت آسان می‌شوند.'; trophy = TROPHY_SVG; }
  else                 { title = 'شروع خوبی بود '; msg = 'حل‌های تشریحی را یک بار دیگر بخوان و دوباره امتحان کن.'; trophy = TROPHY_SVG; }
  $('endTitle').textContent = title;
  $('endMsg').textContent = msg;
  $('trophy').innerHTML = trophy;

  $('results').innerHTML = Q.map((_, i) => {
    const cls = results[i] === true ? 'ok' : results[i] === false ? 'bad' : '';
    return `<div class="res-cell ${cls}">سوال ${toFa(i + 1)}<br>${results[i] === true ? '✓' : results[i] === false ? '✕' : '—'}</div>`;
  }).join('');

  $('dots').style.opacity = .5;
  launchConfetti(60);
}

$('restartBtn').onclick = () => {
  idx = 0; score = 0;
  results.fill(null);
  $('dots').style.opacity = 1;
  $('end').classList.remove('show');
  $('quiz').style.display = 'block';
  render();
};

/* ---- confetti ---- */
function launchConfetti(count = 30) {
  const colors = ['#ffd86b', '#ff6b9a', '#7cf5d4', '#ffb86c', '#9b8cff', '#ffffff'];
  for (let i = 0; i < count; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random() * 100 + 'vw';
    c.style.background = colors[Math.floor(Math.random() * colors.length)];
    c.style.animationDuration = (2 + Math.random() * 2) + 's';
    c.style.animationDelay = Math.random() * 0.4 + 's';
    c.style.transform = `rotate(${Math.random() * 360}deg)`;
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 4500);
  }
}

buildDots();
render();

/* ===== extra polish JS ===== */
// comet ball follows current question
function moveBall() {
  const b = $('ball'), d = $('dot' + idx);
  if (!b || !d) return;
  b.style.left = (d.offsetLeft + d.offsetWidth / 2) + 'px';
}
const _updateDotsBase = updateDots;
updateDots = function () { _updateDotsBase(); moveBall(); };
window.addEventListener('resize', moveBall);

// 3D tilt on option cards
function tilt(el) {
  el.addEventListener('mousemove', e => {
    const r = el.getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width - .5;
    const y = (e.clientY - r.top) / r.height - .5;
    el.style.transform = `perspective(600px) rotateX(${-y * 12}deg) rotateY(${x * 12}deg) translateY(-3px)`;
  });
  el.addEventListener('mouseleave', () => { el.style.transform = ''; });
}

// chalk-like typing of the title
function typeTitle() {
  const t = document.querySelector('.title');
  if (!t) return;
  const full = t.textContent;
  t.textContent = '';
  let i = 0;
  const iv = setInterval(() => {
    t.textContent = full.slice(0, ++i);
    if (i >= full.length) clearInterval(iv);
  }, 70);
}

// floating luminous particles
(function particles() {
  const cv = $('particles'), ctx = cv.getContext('2d');
  const colors = ['#a78bfa', '#7dd3fc', '#f0abfc', '#ffffff', '#7cf5d4'];
  let W, H, pts = [];
  function resize() {
    W = cv.width = innerWidth; H = cv.height = innerHeight;
    pts = Array.from({ length: Math.min(70, Math.floor(W * H / 16000)) }, () => ({
      x: Math.random() * W, y: Math.random() * H,
      vx: (Math.random() - .5) * .3, vy: -Math.random() * .5 - .1,
      r: Math.random() * 2 + .6, c: colors[Math.floor(Math.random() * colors.length)],
      a: Math.random()
    }));
  }
  function frame() {
    ctx.clearRect(0, 0, W, H);
    pts.forEach(p => {
      p.x += p.vx; p.y += p.vy; p.a += .01;
      if (p.y < -5) { p.y = H + 5; p.x = Math.random() * W; }
      const alpha = .35 + .35 * Math.sin(p.a);
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = p.c;
      ctx.globalAlpha = alpha;
      ctx.shadowBlur = 10; ctx.shadowColor = p.c;
      ctx.fill();
    });
    ctx.globalAlpha = 1; ctx.shadowBlur = 0;
    requestAnimationFrame(frame);
  }
  resize(); frame();
  window.addEventListener('resize', resize);
})();

typeTitle();
moveBall();

/* ===== synthesized sounds (no files needed) ===== */
let soundOn = true;
let audioCtx = null;

function getCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function tone(freq, start, dur, type = 'sine', vol = 0.18) {
  const ctx = getCtx();
  const t0 = ctx.currentTime + start;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t0);
  gain.gain.setValueAtTime(0.0001, t0);
  gain.gain.exponentialRampToValueAtTime(vol, t0 + 0.02);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  osc.connect(gain).connect(ctx.destination);
  osc.start(t0);
  osc.stop(t0 + dur + 0.05);
}

function playSound(correct) {
  if (!soundOn) return;
  if (correct) {
    // bright rising arpeggio: C5, E5, G5, C6
    tone(523.25, 0.00, 0.35);
    tone(659.25, 0.08, 0.35);
    tone(783.99, 0.16, 0.35);
    tone(1046.5, 0.24, 0.55, 'triangle', 0.16);
  } else {
    // soft descending "tick"
    tone(260, 0.00, 0.18, 'triangle', 0.14);
    tone(196, 0.12, 0.28, 'triangle', 0.12);
  }
}

$('soundBtn').addEventListener('click', () => {
  soundOn = !soundOn;
  const b = $('soundBtn');
  b.textContent = soundOn ? '♪' : '×';
  b.classList.toggle('muted', !soundOn);
});

/* ===== creative polish pack JS ===== */
function changeTo(n) {
  const q = $('quiz');
  if (q.classList.contains('out')) return;
  q.classList.add('out');
  setTimeout(() => {
    idx = n;
    render();
    q.classList.remove('out');
    q.classList.add('in');
    setTimeout(() => q.classList.remove('in'), 460);
  }, 280);
}
$('nextBtn').onclick = () => {
  if (idx >= Q.length - 1) return showEnd();
  changeTo(idx + 1);
};
$('prevBtn').onclick = () => {
  if (idx > 0) changeTo(idx - 1);
};
</script>
